<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="Mapa del circuito GO KART SPORT BAR: pista, sport bar y terraza.">
  <title>Mapa del circuito — GO KART SPORT BAR</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="./css/styles.css">
  <style>
    .mapa-wrap { position: relative; margin: 0 1rem; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: #0d1017; }
    .mapa-scroll { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .mapa-scroll::-webkit-scrollbar { display: none; }
    .mapa-lienzo { position: relative; width: 100%; aspect-ratio: 16 / 9; }
    .mapa-lienzo img { width: 100%; height: 100%; object-fit: cover; }
    .mapa-lienzo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .zona { cursor: pointer; fill: rgba(255,53,69,.10); stroke: rgba(255,53,69,.75); stroke-width: 4; stroke-dasharray: 14 8; transition: fill .2s; }
    .zona.amarilla { fill: rgba(255,220,53,.10); stroke: rgba(255,220,53,.85); }
    .zona:hover, .zona.on { fill: rgba(255,53,69,.32); stroke-dasharray: none; stroke-width: 6; }
    .zona.amarilla:hover, .zona.amarilla.on { fill: rgba(255,220,53,.28); }
    .pin { pointer-events: none; }
    .pin circle.pulso { fill: var(--red); opacity: .5; transform-box: fill-box; transform-origin: center; animation: pulso 1.8s ease-out infinite; }
    .pin.amarilla circle.pulso { fill: var(--yellow); }
    .pin text { font-family: 'Russo One', sans-serif; font-size: 34px; fill: #fff; paint-order: stroke; stroke: #090b10; stroke-width: 8px; text-anchor: middle; }
    @keyframes pulso { from { transform: scale(.6); opacity: .7; } to { transform: scale(2.4); opacity: 0; } }
    .mapa-ayuda { position: absolute; left: .6rem; bottom: .6rem; font-size: .72rem; font-weight: 700; background: rgba(9,11,16,.8); padding: .3rem .6rem; border-radius: 99px; color: var(--muted); }
    .leyenda { display: flex; gap: .5rem; overflow-x: auto; padding: .9rem 1rem 0; scrollbar-width: none; }
    .leyenda::-webkit-scrollbar { display: none; }
    .info-zona { margin: 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem; }
    .info-zona h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.3rem; text-transform: uppercase; display: flex; align-items: center; gap: .55rem; }
    .info-zona h2 i { width: 12px; height: 12px; border-radius: 3px; background: var(--red); }
    .info-zona.amarilla h2 i { background: var(--yellow); }
    .info-zona p { color: var(--muted); font-size: .9rem; margin: .35rem 0 .8rem; }
    .info-datos { display: flex; flex-wrap: wrap; gap: .45rem; margin-bottom: 1rem; }
    .info-datos span { font-size: .76rem; background: var(--black); border: 1px solid var(--line); border-radius: 99px; padding: .25rem .65rem; }
    .info-acciones { display: grid; gap: .55rem; }
    .llegar { display: grid; grid-template-columns: 96px 1fr; gap: .9rem; align-items: center; margin: 0 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: .7rem; text-decoration: none; }
    .llegar img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; }
    .llegar b { font-family: var(--font-display); font-weight: 400; display: block; }
    .llegar span { color: var(--muted); font-size: .82rem; }
    @media (max-width: 520px) { .mapa-lienzo { width: 150%; } }   /* en el celular el mapa se desliza a los costados */
  </style>
</head>
<body class="con-nav">

  <header class="header">
    <a href="./index.html" class="header-logo" aria-label="GO KART SPORT BAR — inicio"><img src="./img/logo.png" alt="GO KART SPORT BAR"></a>
    <a href="./index.html#reservar" class="estado-pill" style="text-decoration:none;color:var(--white)">Reservar ↗</a>
  </header>

  <div class="page-head">
    <h1>Mapa del <span style="color:var(--red)">circuito</span></h1>
    <p>Toca una zona para ver qué hay y reservar.</p>
  </div>

  <div class="mapa-wrap">
    <div class="mapa-scroll" id="mapa-scroll">
      <div class="mapa-lienzo">
        <img src="./img/render-aereo.jpg" alt="Vista aérea: pista de karting, sport bar y terraza">
        <svg viewBox="0 0 1600 900" preserveAspectRatio="none" aria-label="Zonas del lugar">
          <polygon class="zona" data-zona="pista" tabindex="0" role="button" aria-label="Pista"
            points="395,395 520,300 900,215 1180,250 1480,385 1420,470 1340,590 1150,720 960,900 600,900 470,640"/>
          <polygon class="zona amarilla" data-zona="bar" tabindex="0" role="button" aria-label="Sport Bar"
            points="195,335 225,210 415,205 410,280 370,330 260,360"/>
          <polygon class="zona amarilla" data-zona="terraza" tabindex="0" role="button" aria-label="Terraza"
            points="525,175 535,145 935,120 930,200 820,230 600,245 545,235"/>
          <g class="pin" transform="translate(900 560)"><circle class="pulso" r="22"/><circle r="11" fill="#ff3545" stroke="#fff" stroke-width="4"/><text y="-30">PISTA</text></g>
          <g class="pin amarilla" transform="translate(300 280)"><circle class="pulso" r="22"/><circle r="11" fill="#ffdc35" stroke="#090b10" stroke-width="4"/><text y="-30">SPORT BAR</text></g>
          <g class="pin amarilla" transform="translate(735 185)"><circle class="pulso" r="22"/><circle r="11" fill="#ffdc35" stroke="#090b10" stroke-width="4"/><text y="-30">TERRAZA</text></g>
        </svg>
      </div>
    </div>
    <span class="mapa-ayuda" id="mapa-ayuda">↔ Desliza para ver todo</span>
  </div>

  <div class="leyenda" role="tablist" aria-label="Zonas">
    <button class="tab on" data-zona="pista" role="tab">🏁 Pista</button>
    <button class="tab" data-zona="bar" role="tab">🍔 Sport Bar</button>
    <button class="tab" data-zona="terraza" role="tab">☀️ Terraza</button>
  </div>

  <section class="info-zona" id="info-zona" aria-live="polite"></section>

  <a class="llegar" href="https://www.google.com/maps/search/?api=1&query=FEXCO+Cochabamba" target="_blank" rel="noopener">
    <img src="./img/como-llegar.jpg" alt="Plano de cómo llegar a FEXCO" loading="lazy">
    <div><b>¿Cómo llegar?</b><span>Campo ferial FEXCO · Puerta 1B, sobre Circuito Bolivia. Abrir en Google Maps ↗</span></div>
  </a>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <a href="./index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z"/></svg>Inicio
    </a>
    <a href="./mapa.html" class="on" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 2.5v13L9 17l6 2.5 6-2.5v-13L15 6.5Z"/><path d="M9 4v13M15 6.5v13"/></svg>Mapa
    </a>
    <a href="./menu.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2v8a2 2 0 0 0 2 2v10M5 2v6M9 2v6M17 22V2c-2 1-3 3.5-3 7v4h3"/></svg>Menú
    </a>
    <a href="./cuenta.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Mi cuenta
    </a>
  </nav>

  <script src="./js/mapa.js"></script>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
  </script>
</body>
</html>
