<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <title>Mi cuenta — GO KART SPORT BAR</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="./css/styles.css">
  <style>
    .perfil { display: flex; align-items: center; gap: .9rem; margin: 0 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; }
    .avatar { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.3rem; background: linear-gradient(135deg, var(--red), var(--red-dark)); flex: 0 0 auto; }
    .perfil b { font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; display: block; }
    .perfil span { color: var(--muted); font-size: .85rem; }
    .reservas { display: grid; gap: .7rem; }
    .reserva { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--orange); border-radius: 14px; padding: .85rem 1rem; }
    .reserva.pasada { opacity: .55; border-left-color: var(--line); }
    .reserva-top { display: flex; justify-content: space-between; gap: .5rem; align-items: baseline; }
    .reserva-top b { font-family: var(--font-display); font-weight: 400; }
    .reserva p { color: var(--muted); font-size: .84rem; margin-top: .2rem; }
    .vacio { text-align: center; color: var(--muted); padding: 1.6rem 1rem; border: 1.5px dashed var(--line); border-radius: var(--radius); }
    .vacio .btn { margin-top: .9rem; width: auto; }
    .link-staff { display: block; text-align: center; color: var(--muted); font-size: .8rem; margin: 1.6rem 0 .5rem; }
  </style>
</head>
<body class="con-nav">

  <header class="header">
    <a href="./index.html" class="header-logo" aria-label="GO KART SPORT BAR — inicio"><img src="./img/logo.png" alt="GO KART SPORT BAR"></a>
  </header>

  <div class="page-head">
    <h1>Mi <span style="color:var(--red)">cuenta</span></h1>
    <p>Tus datos y reservas guardados en este teléfono.</p>
  </div>

  <div class="perfil" id="perfil"></div>

  <section class="section">
    <h2 class="section-title">Mis <span>reservas</span></h2>
    <div class="reservas" id="reservas"></div>
    <p class="form-ayuda" style="margin-top:.8rem">El estado se confirma por WhatsApp. Las reservas hechas desde otro teléfono no aparecen aquí.</p>
  </section>

  <section class="section">
    <button type="button" class="btn btn-ghost" id="borrar">Borrar mis datos de este teléfono</button>
    <a class="link-staff" href="./admin.html">Acceso para el personal →</a>
  </section>

  <nav class="bottom-nav" aria-label="Navegación principal">
    <a href="./index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z"/></svg>Inicio
    </a>
    <a href="./mapa.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 4-6 2.5v13L9 17l6 2.5 6-2.5v-13L15 6.5Z"/><path d="M9 4v13M15 6.5v13"/></svg>Mapa
    </a>
    <a href="./menu.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 2v8a2 2 0 0 0 2 2v10M5 2v6M9 2v6M17 22V2c-2 1-3 3.5-3 7v4h3"/></svg>Menú
    </a>
    <a href="./cuenta.html" class="on" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Mi cuenta
    </a>
  </nav>

  <script>
    // Datos guardados por app.js al reservar (localStorage: gk_cliente, gk_reservas)
    const $ = id => document.getElementById(id);
    const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
    const leer = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
    const hoy = (() => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })();
    const larga = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("es-BO", { weekday: "short", day: "numeric", month: "short" }); };

    function pintar() {
      const c = leer("gk_cliente"), rs = leer("gk_reservas") || [];
      const p = $("perfil"); p.innerHTML = "";
      p.appendChild(el("div", "avatar", c && c.nombre ? c.nombre.trim()[0].toUpperCase() : "🏎"));
      const t = el("div"); t.appendChild(el("b", null, c && c.nombre ? c.nombre : "Piloto invitado"));
      t.appendChild(el("span", null, c && c.telefono ? "WhatsApp " + c.telefono : "Tus datos se guardan al hacer tu primera reserva."));
      p.appendChild(t);
      const box = $("reservas"); box.innerHTML = "";
      if (!rs.length) {
        const v = el("div", "vacio", "Todavía no hiciste reservas desde este teléfono.");
        v.appendChild(document.createElement("br"));
        const a = el("a", "btn btn-primary", "Reservar una carrera ↗"); a.href = "./index.html#reservar"; v.appendChild(a);
        box.appendChild(v); return;
      }
      rs.forEach(r => {
        const card = el("article", "reserva" + (r.fecha < hoy ? " pasada" : ""));
        const top = el("div", "reserva-top");
        top.appendChild(el("b", null, larga(r.fecha) + " · " + r.hora));
        top.appendChild(el("span", "badge badge-pendiente", r.fecha < hoy ? "Pasada" : "Pendiente"));
        card.appendChild(top);
        card.appendChild(el("p", null, (r.servicio || "Carrera") + " · " + r.participantes + (r.participantes === 1 ? " piloto" : " pilotos") + " · Código " + String(r.codigo || "").slice(0, 8).toUpperCase()));
        box.appendChild(card);
      });
    }
    $("borrar").addEventListener("click", () => {
      if (!confirm("¿Borrar tus datos y el historial de reservas de este teléfono? Las reservas siguen existiendo en el sistema.")) return;
      ["gk_cliente", "gk_reservas", "gk_pedido"].forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
      pintar();
    });
    pintar();
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
  </script>
</body>
</html>
